server {
    listen 80;
    listen [::]:80;

    # Replace with your domain or server IP
    server_name example.com; 

    # Larger client body size for form submits (optional)
    client_max_body_size 5M;

    location /static/ {
        # Serve static files directly. Replace with absolute path to your project's static dir
        alias /path/to/weather-app/static/;
        access_log off;
        expires 1d;
    }

    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;

        # pass to gunicorn listening on localhost:8000
        proxy_pass http://127.0.0.1:8000;
        proxy_redirect off;

        # Websocket/timeouts (if needed)
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
}
