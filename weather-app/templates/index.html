{% extends "base.html" %}

{% block title %}Weather Search - Weather App{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-lg">
            <div class="card-body p-5">
                <h1 class="card-title text-center mb-4">Search Weather</h1>
                
                <form id="weatherForm">
                    <div class="input-group mb-3">
                        <input 
                            type="text" 
                            class="form-control form-control-lg" 
                            id="cityInput" 
                            placeholder="Enter city name..." 
                            autocomplete="off"
                            required
                        >
                        <button class="btn btn-primary btn-lg" type="submit" id="searchBtn">
                            Search
                        </button>
                    </div>
                </form>

                <div id="errorAlert" class="alert alert-danger alert-dismissible fade hide" role="alert">
                    <span id="errorMessage"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div id="loadingSpinner" class="text-center hide">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2">Fetching weather data...</p>
                </div>

                <div id="weatherResults"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const tempUnit = localStorage.getItem('tempUnit') || 'C';
    updateTempToggleButton(tempUnit);
    
    document.getElementById('weatherForm').addEventListener('submit', searchWeather);
    document.getElementById('tempToggle').addEventListener('click', toggleTemperatureUnit);
</script>
{% endblock %}
